name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders. Nothing here reaches a real project — the build only needs
  # these to exist, and the smoke test asserts behaviour that holds without
  # valid credentials.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  database:
    name: Schema & RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The suite runs against a plain PostgreSQL server plus the shim in
      # supabase/tests, so it needs no Docker and no hosted project.
      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-contrib-16

      - name: Apply migrations and run the RLS suite
        run: bash scripts/db-test.sh
        env:
          PGBIN: /usr/lib/postgresql/16/bin

  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke test the running app
        run: bash scripts/smoke-test.sh

  mobile:
    name: Mobile bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Proves Metro can resolve the shared workspace packages from React
      # Native, which a plain typecheck would not catch.
      - name: Bundle for Android
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/expo-export
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
